name: Release

# Builds the Debian package on the oldest supported Ubuntu (glibc 2.35),
# so it runs on Ubuntu 22.04+, Linux Mint 21+ and Debian 12+.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build .deb
        run: cargo tauri build --bundles deb

      - name: Collect artifacts
        run: |
          version=$(jq -r .version tauri.conf.json)
          mkdir -p ../dist-release
          # Debian naming convention: lowercase package name
          cp target/release/bundle/deb/*.deb "../dist-release/otp-scout_${version}_amd64.deb"
          cd ../dist-release
          sha256sum *.deb > SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: otp-scout-deb
          path: dist-release/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          body: |
            ## Install (Ubuntu 22.04+, Linux Mint 21+, Debian 12+)

            ```bash
            sudo apt install ./otp-scout_*_amd64.deb
            ```

            Then start **OTP-Scout** from the application menu – it lives in the system tray.
            Verify the download with `sha256sum -c SHA256SUMS`.
